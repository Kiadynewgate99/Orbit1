<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/logo-orbit.svg" />
  <title>Notifications - Orbit</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="page-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">CHARGEMENT</div>
  </div>

  <div class="app-shell-mount"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/app.js"></script>
  <script>
    (async function () {
      window.addEventListener('load', () => ClubHub.hideLoader());

      const user = ClubHub.Auth.require();
      if (!user) throw new Error('Unauthorized');

      let notifications = [];
      try {
        const res = await ClubHubAPI.notifications();
        notifications = res.data || res;
      } catch (e) {
        notifications = [];
      }

      const groupByDate = (notifs) => {
        const today = new Date().toISOString().split('T')[0];
        const groups = { today: [], week: [], older: [] };
        notifs.forEach(n => {
          const d = n.created_at ? n.created_at.split('T')[0] : '';
          if (d === today) groups.today.push(n);
          else if (d >= '2026-07-20') groups.week.push(n);
          else groups.older.push(n);
        });
        return groups;
      };

      const groups = groupByDate(notifications);

      const renderNotif = (n) => `
        <div class="notification ${n.read ? '' : 'unread'}" data-id="${n.id}">
          <div class="notification-icon ${n.kind === 'inscription' ? 'success' : n.kind === 'event' ? 'event' : n.kind === 'system' ? 'warning' : 'info'}">${n.icon || 'i'}</div>
          <div class="notification-content">
            <div class="notification-title">${n.title}</div>
            <div class="notification-message">${n.message}</div>
            <div class="notification-time">${n.created_at ? new Date(n.created_at).toLocaleDateString('fr-FR', { month: 'short', day: 'numeric' }) : ''}</div>
          </div>
        </div>
      `;

      const renderGroup = (label, items) => {
        if (!items.length) return '';
        return `
          <div class="text-mono" style="font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.15em; text-transform: uppercase; margin: var(--s-5) 0 var(--s-2); font-weight: 700;">${label}</div>
          ${items.map(renderNotif).join('')}
        `;
      };

      const content = `
        <div class="card">
          <div class="flex items-center justify-between" style="margin-bottom: var(--s-4);">
            <h2 style="font-size: var(--fs-lg); font-weight: 800;">Notifications</h2>
            <div class="flex gap-2">
              <button class="btn btn-secondary btn-sm" id="btn-mark-all-read">Tout marquer comme lu</button>
            </div>
          </div>
          ${renderGroup("Aujourd'hui", groups.today)}
          ${renderGroup("Cette semaine", groups.week)}
          ${renderGroup("Plus ancien", groups.older)}
          ${notifications.length === 0 ? '<p class="text-muted">Aucune notification.</p>' : ''}
        </div>
      `;

      ClubHub.renderShell({
        active: 'notifications',
        role: 'student',
        content,
        pageTitle: 'Notifications',
        pageSubtitle: 'Toutes vos alertes et communications en un seul endroit.',
      });

      document.getElementById('btn-mark-all-read')?.addEventListener('click', async () => {
        try {
          await ClubHubAPI.markAllRead();
          notifications.forEach(n => n.read = true);
          const btn = document.getElementById('btn-mark-all-read');
          if (btn) btn.disabled = true;
          document.querySelectorAll('.notification.unread').forEach(el => el.classList.remove('unread'));
          ClubHub.toast('Notifications', 'Toutes les notifications ont été marquées comme lues.', 'success');
        } catch (e) {
          ClubHub.toast('Erreur', 'Impossible de marquer les notifications comme lues.', 'error');
        }
      });

      document.querySelectorAll('.notification').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', async () => {
          const id = el.dataset.id;
          if (!id) return;
          try {
            await ClubHubAPI.markRead(id);
            el.classList.remove('unread');
            ClubHub.toast('Notification', 'Marquée comme lue.', 'success');
          } catch (e) {
            ClubHub.toast('Erreur', 'Impossible de marquer la notification.', 'error');
          }
        });
      });
    })();
  </script>
</body>
</html>

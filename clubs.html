<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/logo-orbit.svg" />
  <title>Annuaire des clubs - Orbit</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .clubs-grid-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--s-4);
    }
    @media (max-width: 768px) { .clubs-grid-list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">CHARGEMENT</div>
  </div>

  <div class="app-shell-mount"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('load', () => ClubHub.hideLoader());

    const content = `
      <div class="card" style="padding: var(--s-5); margin-bottom: var(--s-5);">
        <div class="flex items-center justify-between" style="flex-wrap: wrap; gap: var(--s-3);">
          <div>
            <div class="text-mono" style="font-size: 11px; color: var(--orange); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;">ANNUAIRE</div>
            <strong style="font-size: var(--fs-2xl);">${CLUBHUB.CLUBS.length} clubs actifs</strong>
            <div class="text-muted" style="font-size: var(--fs-sm); margin-top: 2px;">${CLUBHUB.CLUBS.reduce((a, c) => a + c.members, 0)} membres · 8 domaines</div>
          </div>
        </div>
      </div>

      <div class="toolbar" style="position: relative;">
        <div class="search-input toolbar-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="club-search" placeholder="Rechercher un club, un domaine, un tag..." autocomplete="off" />
        </div>
        <div id="search-suggest" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 50; background: var(--white); border: 2px solid var(--black); border-radius: 4px; box-shadow: 4px 4px 0 var(--black); max-height: 320px; overflow-y: auto; display: none;"></div>
        <select class="select" id="club-sort" style="max-width: 180px;">
          <option value="name">Trier par nom</option>
          <option value="members">Trier par membres</option>
          <option value="events">Trier par activité</option>
        </select>
        <select class="select" id="club-domain" style="max-width: 200px;">
          <option value="all">Tous les domaines</option>
          ${CLUBHUB.CLUB_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('')}
        </select>
      </div>

      <div class="chip-group" style="margin-bottom: var(--s-5);">
        <button class="chip active" data-domain="all">Tous</button>
        ${CLUBHUB.CLUB_CATEGORIES.map(c => `
          <button class="chip" data-domain="${c.id}">${c.icon} ${c.label}</button>
        `).join('')}
      </div>

      <div class="clubs-grid-list" id="clubs-grid"></div>
    `;

    ClubHub.renderShell({
      active: 'clubs',
      role: 'student',
      content,
      pageTitle: 'Annuaire des clubs',
      pageSubtitle: 'Découvrez tous les clubs actifs de l\'université.',
    });

    const grid = document.getElementById('clubs-grid');
    const search = document.getElementById('club-search');
    const sort = document.getElementById('club-sort');
    const domainSel = document.getElementById('club-domain');
    const chips = document.querySelectorAll('.chip');
    let currentDomain = 'all';

    const renderClubs = () => {
      const q = (search.value || '').toLowerCase();
      let list = CLUBHUB.CLUBS.filter(club => {
        const matchesDomain = currentDomain === 'all' || club.domain === currentDomain;
        const matchesSearch = !q || club.name.toLowerCase().includes(q) || club.description.toLowerCase().includes(q) || club.tags.some(t => t.toLowerCase().includes(q));
        return matchesDomain && matchesSearch;
      });

      if (sort.value === 'members') list.sort((a, b) => b.members - a.members);
      else if (sort.value === 'events') list.sort((a, b) => b.events - a.events);
      else list.sort((a, b) => a.name.localeCompare(b.name));

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column: 1 / -1;"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div><div class="empty-title">Aucun club trouvé</div><div class="empty-text">Modifiez vos filtres.</div><button class="btn btn-secondary btn-sm" onclick="resetFilters()">Réinitialiser</button></div>`;
        return;
      }

      grid.innerHTML = list.map(club => `
        <a href="club.html?id=${club.id}" class="club-card">
          <div class="club-card-header">
            <span>${club.id}.html</span>
            <span>◉</span>
          </div>
          <div class="club-card-body">
            <div style="display: flex; gap: var(--s-3); margin-bottom: var(--s-3);">
              <div class="club-card-icon" style="background: ${club.color};">${club.icon}</div>
              <div style="flex: 1;">
                <div class="club-card-name" style="margin-bottom: 2px;">${club.name}</div>
                <div class="club-card-domain">${CLUBHUB.CLUB_CATEGORIES.find(c => c.id === club.domain)?.label || ''}</div>
              </div>
            </div>
            <div class="club-card-desc">${club.description}</div>
            <div class="club-card-tags">
              ${club.tags.slice(0, 2).map(t => `<span class="badge">${t}</span>`).join('')}
            </div>
            <div class="club-card-footer">
              <span>◉ ${club.members}</span>
              <span>◷ ${club.events}</span>
              <span style="margin-left: auto; color: var(--text-primary); font-weight: 700;">Ouvert</span>
            </div>
          </div>
        </a>
      `).join('');
    };

    const resetFilters = () => {
      search.value = '';
      sort.value = 'name';
      domainSel.value = 'all';
      currentDomain = 'all';
      chips.forEach(c => c.classList.toggle('active', c.dataset.domain === 'all'));
      renderClubs();
    };

    search.addEventListener('input', renderClubs);
    sort.addEventListener('change', renderClubs);
    domainSel.addEventListener('change', e => {
      currentDomain = e.target.value;
      chips.forEach(c => c.classList.toggle('active', c.dataset.domain === currentDomain));
      renderClubs();
    });
    chips.forEach(c => c.addEventListener('click', () => {
      chips.forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      currentDomain = c.dataset.domain;
      domainSel.value = currentDomain;
      renderClubs();
    }));

    renderClubs();

    // Autocomplete (debounce 200ms)
    const searchInput = document.getElementById('club-search');
    const suggestBox = document.getElementById('search-suggest');
    let debounceTimer = null;
    searchInput.addEventListener('input', e => {
      clearTimeout(debounceTimer);
      const q = e.target.value.trim();
      if (q.length < 2) { suggestBox.style.display = 'none'; return; }
      debounceTimer = setTimeout(() => {
        const lcQ = q.toLowerCase();
        const matches = CLUBHUB.CLUBS.filter(c =>
          c.name.toLowerCase().includes(lcQ) ||
          c.short_desc.toLowerCase().includes(lcQ) ||
          (c.tags || []).some(t => t.toLowerCase().includes(lcQ))
        ).slice(0, 6);
        if (!matches.length) { suggestBox.style.display = 'none'; return; }
        suggestBox.innerHTML = matches.map(c => `
          <a href="club.html?id=${c.id}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); text-decoration: none; color: var(--text-primary); transition: background 0.15s;" onmouseover="this.style.background='var(--lime-soft)'" onmouseout="this.style.background=''">
            <div style="width: 32px; height: 32px; border-radius: 4px; background: ${c.color}; color: ${c.cat === 'sport' || c.cat === 'environnement' || c.cat === 'culture' || c.cat === 'debats' ? '#000' : '#fff'}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px;">${c.short}</div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-weight: 700; font-size: 13px;">${c.name}</div>
              <div style="font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono);">${c.category.toUpperCase()} · ${c.members} membres</div>
            </div>
            <span style="color: var(--orange); font-weight: 800;">→</span>
          </a>
        `).join('');
        suggestBox.style.display = 'block';
      }, 200);
    });
    document.addEventListener('click', e => {
      if (!searchInput.contains(e.target) && !suggestBox.contains(e.target)) {
        suggestBox.style.display = 'none';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/logo-orbit.svg" />
  <title>Espace responsable - Orbit</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .club-banner {
      background: var(--black);
      color: var(--white);
      border: 2px solid var(--black);
      border-radius: var(--r-md);
      padding: var(--s-6);
      margin-bottom: var(--s-5);
      box-shadow: 4px 4px 0 var(--orange);
    }
    .attendance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--s-3);
    }
    .attendance-card {
      padding: var(--s-3);
      background: var(--white);
      border: 1px solid var(--black);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all var(--t-fast);
      display: flex;
      align-items: center;
      gap: var(--s-3);
    }
    .attendance-card:hover { background: var(--lime); }
  </style>
</head>
<body>
  <div class="page-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">CHARGEMENT</div>
  </div>

  <div class="app-shell-mount"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/app.js"></script>
  <script>
    (async function () {
      window.addEventListener('load', () => ClubHub.hideLoader());

      const user = ClubHub.Auth.require('manager');
      if (!user) throw new Error('Unauthorized');

      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab') || 'overview';

      let myClub = null;
      let apiMembers = [];
      let apiEvents = [];
      let agendaEvents = [];

      try {
        const meRes = await ClubHubAPI.me();
        const managedId = meRes.data?.managed_club_id || user.managed_club_id;
        if (managedId) {
          const clubRes = await ClubHubAPI.club(managedId);
          myClub = clubRes.data || null;
        }
        if (myClub) {
          const [eventsRes, inscriptionsRes] = await Promise.all([
            ClubHubAPI.events({ club_id: myClub.id || myClub.slug }),
            ClubHubAPI.myClubs(),
          ]);
          apiEvents = eventsRes.data || [];
          agendaEvents = apiEvents;
          apiMembers = (inscriptionsRes.data || []).filter(i => (i.club_id == myClub.id || i.club_id == myClub.slug) && i.status === 'active');
        }
      } catch (e) {
        myClub = CLUBHUB.CLUBS.find(c => c.id === user.managedClub) || CLUBHUB.CLUBS[1];
      }

      if (!myClub) myClub = CLUBHUB.CLUBS[1];

      const members = apiMembers.length ? apiMembers.map((m, i) => ({
        id: m.user_id || m.id || `m-${i}`,
        name: m.user_name || m.name || 'Membre',
        avatar: (m.user_name || m.name || '?').substring(0, 2).toUpperCase(),
        matricule: m.user_matricule || m.matricule || '-',
        filiere: m.filiere || '-',
        niveau: m.niveau || '-',
        joined: m.joined_at ? m.joined_at.split('T')[0] : new Date().toISOString().split('T')[0],
        attendance: m.attendance || Math.floor(Math.random() * 40 + 50),
        role: m.role_in_club === 'president' ? 'Président' : m.role_in_club === 'bureau' ? 'Bureau' : 'Membre',
        status: m.status === 'active' ? 'active' : 'inactive',
        presence: Math.random() > 0.2,
      })) : [];

      const activeMembers = members.filter(m => m.status === 'active').length;

    const pageTitleMap = {
      overview: 'Espace responsable',
      members: 'Gestion des membres',
      events: 'Événements du club',
      attendance: 'Suivi des présences',
      comms: 'Communications',
      stats: 'Statistiques',
      export: 'Exports & données',
    };

    const renderOverview = () => `
      <div class="club-banner">
        <div class="flex items-center gap-4" style="flex-wrap: wrap;">
          <div class="avatar avatar-xl" style="background: ${myClub.color}; color: var(--white); width: 64px; height: 64px; font-size: 20px;">${myClub.name.substring(0, 2).toUpperCase()}</div>
          <div style="flex: 1; min-width: 240px;">
            <div class="text-mono" style="font-size: 11px; color: var(--lime); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;">CLUB GÉRÉ</div>
            <h2 style="font-size: var(--fs-2xl); margin: 4px 0;">${myClub.name}</h2>
            <p style="color: rgba(255,255,255,0.7); font-size: var(--fs-sm);">${myClub.short_desc || myClub.description || ''}</p>
          </div>
          <div class="flex gap-2">
            <a href="club.html?id=${myClub.slug || myClub.id}" class="btn btn-sm" style="background: var(--white); color: var(--black);">Voir la page</a>
            <button class="btn btn-orange btn-sm" onclick="openEditClubModal()">Modifier</button>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card stat-card-orange">
          <div>
            <div class="stat-label">Membres actifs</div>
            <span class="stat-trend">+ 8 ce mois</span>
          </div>
          <div class="stat-value">${activeMembers}</div>
        </div>
        <div class="stat-card stat-card-lime">
          <div>
            <div class="stat-label">Événements planifiés</div>
            <span class="stat-trend" style="background: rgba(0,0,0,0.1);">+ 3 ce mois</span>
          </div>
          <div class="stat-value">${apiEvents.length || CLUBHUB.EVENTS.filter(e => e.clubId === myClub.id || e.clubId === myClub.slug).length}</div>
        </div>
        <div class="stat-card stat-card-white">
          <div>
            <div class="stat-label">Taux de présence</div>
            <span class="stat-trend" style="background: var(--lime); color: var(--black);">- 3% ce mois</span>
          </div>
          <div class="stat-value">76<span style="font-size: var(--fs-md); color: var(--text-tertiary);">%</span></div>
        </div>
      </div>

      <div class="grid" style="grid-template-columns: 2fr 1fr; gap: var(--s-5); margin-bottom: var(--s-5);">
        <div class="chart-card">
          <div class="chart-header">
            <h3 class="chart-title">Inscriptions sur 6 mois</h3>
            <div class="chart-tabs">
              <span class="chart-tab active">6 mois</span>
            </div>
          </div>
          <div class="chart-bars">
            <div class="chart-bar-wrap"><div class="chart-bar" style="height: 45%;"></div><div class="chart-bar-label">Fév</div></div>
            <div class="chart-bar-wrap"><div class="chart-bar" style="height: 60%;"></div><div class="chart-bar-label">Mars</div></div>
            <div class="chart-bar-wrap"><div class="chart-bar" style="height: 50%;"></div><div class="chart-bar-label">Avr</div></div>
            <div class="chart-bar-wrap"><div class="chart-bar" style="height: 75%;"></div><div class="chart-bar-label">Mai</div></div>
            <div class="chart-bar-wrap"><div class="chart-bar" style="height: 85%;"></div><div class="chart-bar-label">Juin</div></div>
            <div class="chart-bar-wrap"><div class="chart-bar orange" style="height: 95%;"></div><div class="chart-bar-label">Juil</div></div>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size: var(--fs-base); font-weight: 800; margin-bottom: var(--s-4);">Répartition par filière</h3>
          <div class="donut-wrap">
            <svg viewBox="0 0 36 36" style="width: 100%; height: 100%;">
              <circle cx="18" cy="18" r="15.9" fill="none" stroke="#ff4502" stroke-width="3" stroke-dasharray="35 100" stroke-dashoffset="0" transform="rotate(-90 18 18)"/>
              <circle cx="18" cy="18" r="15.9" fill="none" stroke="#dcb8ff" stroke-width="3" stroke-dasharray="25 100" stroke-dashoffset="-35" transform="rotate(-90 18 18)"/>
              <circle cx="18" cy="18" r="15.9" fill="none" stroke="#0044ff" stroke-width="3" stroke-dasharray="20 100" stroke-dashoffset="-60" transform="rotate(-90 18 18)"/>
              <circle cx="18" cy="18" r="15.9" fill="none" stroke="#c2ff01" stroke-width="3" stroke-dasharray="20 100" stroke-dashoffset="-80" transform="rotate(-90 18 18)"/>
            </svg>
            <div class="donut-center">
              <div class="donut-percent">100%</div>
              <div class="donut-label">Total</div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-2" style="gap: var(--s-5);">
        <div class="card">
          <h3 style="font-size: var(--fs-base); font-weight: 800; margin-bottom: var(--s-4);">Actions rapides</h3>
          <div class="grid grid-2" style="gap: var(--s-3);">
            ${['Ajouter membre', 'Créer événement', 'Envoyer message', 'Exporter'].map((a, i) => {
              const icons = ['plus', 'calendar', 'mail', 'download'];
const actions = [
                 () => { window.location.href = 'manager.html?tab=members'; },
                 () => { window.location.href = 'manager.html?tab=events'; },
                 () => { window.location.href = 'manager.html?tab=comms'; },
                 () => { window.location.href = 'manager.html?tab=export'; },
               ];
              return `<button class="btn btn-secondary" style="justify-content: flex-start; padding: var(--s-3);" onclick="(${actions[i].toString()})()">
                ${CLUBHUB.ICONS[icons[i]].replace('<svg ', '<svg width="18" height="18" ')}
                <span style="font-weight: 600;">${a}</span>
              </button>`;
            }).join('')}
          </div>
        </div>

        <div class="card">
          <h3 style="font-size: var(--fs-base); font-weight: 800; margin-bottom: var(--s-4);">Tâches en attente</h3>
          <div class="activity-item">
            <div class="activity-dot" style="background: var(--orange);"></div>
            <div class="activity-text">
              Valider 3 nouvelles inscriptions
              <div class="activity-time">Aujourd'hui</div>
            </div>
          </div>
          <div class="activity-item">
            <div class="activity-dot" style="background: var(--blue);"></div>
            <div class="activity-text">
              Confirmer la salle pour l'événement du 25/07
              <div class="activity-time">Cette semaine</div>
            </div>
          </div>
        </div>
      </div>
    `;

    const renderMembers = () => `
      <div class="card">
        <div class="flex items-center justify-between" style="flex-wrap: wrap; gap: var(--s-3); margin-bottom: var(--s-4);">
          <div>
            <strong style="font-size: var(--fs-lg);">${activeMembers} membres actifs</strong>
            <span class="text-muted" style="font-size: var(--fs-sm);"> sur ${members.length} au total</span>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-secondary btn-sm" onclick="exportMembersCSV()">↓ Exporter CSV</button>
            <button class="btn btn-orange btn-sm" onclick="openAddMemberModal()">+ Ajouter un membre</button>
          </div>
        </div>

        <div class="toolbar">
          <div class="search-input toolbar-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="member-search" placeholder="Rechercher un membre..." oninput="filterMembers()" />
          </div>
          <select class="select" id="member-role" style="max-width: 160px;" onchange="filterMembers()">
            <option value="all">Tous les roles</option>
            <option value="President">President</option>
            <option value="Bureau">Bureau</option>
            <option value="Membre">Membre</option>
          </select>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th><input type="checkbox" class="checkbox" /></th>
                <th>Membre</th>
                <th>Filiere / Niveau</th>
                <th>Rejoint le</th>
                <th>Presentation</th>
                <th>Role</th>
                <th>Statut</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="members-tbody">
              ${members.map(m => `
                <tr data-role="${m.role}" data-name="${m.name.toLowerCase()}">
                  <td><input type="checkbox" class="checkbox" /></td>
                  <td>
                    <div class="member-cell">
                      <div class="avatar" style="background: ${myClub.color}; color: var(--white);">${m.avatar}</div>
                      <div class="member-info">
                        <strong>${m.name}</strong>
                        <span>${m.matricule}</span>
                      </div>
                    </div>
                  </td>
                  <td>${m.filiere} · ${m.niveau}</td>
                  <td><span class="text-mono" style="font-size: var(--fs-xs); font-weight: 600;">${m.joined}</span></td>
                  <td>
                    <div class="flex items-center gap-2">
                      <div class="progress" style="width: 80px; height: 6px;">
                        <div class="progress-bar" style="width: ${m.attendance}%; background: var(--orange);"></div>
                      </div>
                      <span class="text-mono" style="font-size: var(--fs-xs); font-weight: 600;">${m.attendance}%</span>
                    </div>
                  </td>
                  <td><span class="badge ${m.role === 'Bureau' || m.role === 'President' ? 'badge-orange' : ''}">${m.role}</span></td>
                  <td>${m.status === 'active' ? '<span class="badge badge-lime">Actif</span>' : '<span class="badge" style="background: var(--orange); color: var(--white);">Inactif</span>'}</td>
                  <td>
                    <button class="btn-icon" onclick="viewMember('${m.id}')">${CLUBHUB.ICONS.eye.replace('<svg ', '<svg width="14" height="14" ')}</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const renderAttendance = () => `
      <div class="grid grid-2" style="gap: var(--s-5);">
        <div class="card" style="text-align: center;">
          <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-2);">QR Code - Atelier du 25/07</h3>
          <p class="text-muted" style="margin-bottom: var(--s-4); font-size: var(--fs-sm);">Les etudiants scannent ce code depuis leur telephone pour valider leur presence en 2 secondes.</p>
          <div id="qr-display" style="display: inline-block; padding: var(--s-4); background: var(--white); border: 4px solid var(--black); border-radius: var(--r-md); box-shadow: 8px 8px 0 var(--orange);">
            <svg viewBox="0 0 200 200" width="220" height="220" xmlns="http://www.w3.org/2000/svg">
              <rect width="200" height="200" fill="#FFFFFF"/>
              ${Array.from({length: 25*25}).map((_, i) => {
                const x = (i % 25) * 8, y = Math.floor(i / 25) * 8;
                // pattern pseudo-aleatoire
                const h = ((i * 7 + 13) % 17) > 7;
                if (x < 24 && y < 24) return ''; // top-left finder
                if (x > 168 && y < 24) return ''; // top-right finder
                if (x < 24 && y > 168) return ''; // bottom-left finder
                return h ? `<rect x="${x}" y="${y}" width="6" height="6" fill="#000"/>` : '';
              }).join('')}
              <!-- Finder patterns -->
              <rect x="0" y="0" width="24" height="24" fill="#000"/>
              <rect x="4" y="4" width="16" height="16" fill="#FFF"/>
              <rect x="8" y="8" width="8" height="8" fill="#000"/>
              <rect x="176" y="0" width="24" height="24" fill="#000"/>
              <rect x="180" y="4" width="16" height="16" fill="#FFF"/>
              <rect x="184" y="8" width="8" height="8" fill="#000"/>
              <rect x="0" y="176" width="24" height="24" fill="#000"/>
              <rect x="4" y="180" width="16" height="16" fill="#FFF"/>
              <rect x="8" y="184" width="8" height="8" fill="#000"/>
              <!-- center logo -->
              <rect x="84" y="84" width="32" height="32" fill="#FF4502" rx="4"/>
              <text x="100" y="106" text-anchor="middle" font-size="18" font-weight="900" fill="#FFF">O</text>
            </svg>
          </div>
          <div class="text-mono" style="font-size: 11px; margin-top: var(--s-3); color: var(--text-tertiary); font-weight: 700; letter-spacing: 0.1em;">CODE: ORBIT-A7B3-2026-0725</div>
          <div class="flex gap-2" style="justify-content: center; margin-top: var(--s-4);">
            <button class="btn btn-primary btn-sm" onclick="refreshQR()">Actualiser</button>
            <button class="btn btn-secondary btn-sm" onclick="zoomQR()">Agrandir</button>
            <button class="btn btn-secondary btn-sm" onclick="downloadQR()">Telecharger</button>
          </div>
          <div class="grid grid-3" style="margin-top: var(--s-4); text-align: left;">
            <div class="stat-card stat-card-lime" style="text-align: center;">
              <div class="stat-label">Scans</div>
              <div class="stat-value">14</div>
            </div>
            <div class="stat-card stat-card-orange" style="text-align: center;">
              <div class="stat-label">Inscrits</div>
              <div class="stat-value">20</div>
            </div>
            <div class="stat-card stat-card-white" style="text-align: center;">
              <div class="stat-label">Taux</div>
              <div class="stat-value">70%</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-2);">Presents en temps reel</h3>
          <p class="text-muted" style="margin-bottom: var(--s-4); font-size: var(--fs-sm);">Mise a jour automatique a chaque scan QR.</p>
          <div class="attendance-grid" id="presence-list" style="max-height: 480px; overflow-y: auto;">
            ${members.slice(0, 20).map((m, i) => `
              <div class="attendance-card" data-member="${m.matricule}">
                <div class="checkbox ${i < 14 ? 'checked' : ''}"></div>
                <div class="avatar" style="width: 32px; height: 32px; font-size: var(--fs-xs); background: ${myClub.color}; color: var(--white);">${m.avatar}</div>
                <div style="flex: 1; min-width: 0;">
                  <div style="font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${m.name}</div>
                  <div class="text-mono" style="font-size: 10px; color: var(--text-tertiary); font-weight: 600;">${m.matricule}${i < 14 ? ' · scanne il y a ' + (i+1) + ' min' : ''}</div>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="flex items-center justify-between" style="margin-top: var(--s-5); padding-top: var(--s-4); border-top: 1px solid var(--border-subtle);">
            <div class="text-mono" style="font-size: var(--fs-sm); font-weight: 600;">
              <span style="color: var(--orange);">14</span>
              <span style="color: var(--text-tertiary);"> / 20 presents (70%)</span>
            </div>
            <div class="flex gap-2">
              <button class="btn btn-secondary btn-sm" onclick="simulateScan()">Simuler un scan</button>
              <button class="btn btn-primary btn-sm" onclick="exportMembersCSV()">Exporter (.csv)</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top: var(--s-5);">
        <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-2);">Ou saisir un code manuellement</h3>
        <p class="text-muted" style="margin-bottom: var(--s-3); font-size: var(--fs-sm);">Un etudiant n'a pas de telephone ? Il peut saisir le code affiche sur l'ecran du responsable.</p>
        <div class="flex gap-2">
          <input class="input" placeholder="ORBIT-XXXX-XXXX-XXXX" style="flex: 1; font-family: var(--font-mono); text-transform: uppercase;" />
          <button class="btn btn-primary" onclick="validateManualCode()">Valider</button>
        </div>
      </div>

      <div class="card" style="margin-top: var(--s-5);">
          <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-2);">Import / Export de données</h3>
          <p class="text-muted" style="margin-bottom: var(--s-3); font-size: var(--fs-sm);">Importez des membres ou exportez les données du club.</p>
          <div class="flex gap-2" style="flex-wrap: wrap;">
            <button class="btn btn-orange btn-sm" onclick="document.getElementById('csv-import').click()">↑ Importer CSV</button>
            <input type="file" id="csv-import" accept=".csv,.txt" style="display:none;" onchange="handleCSVImport(event)" />
            <button class="btn btn-secondary btn-sm" onclick="ClubHub.toast('Export CSV lancé','','info')">↓ Exporter CSV</button>
            <button class="btn btn-secondary btn-sm" onclick="ClubHub.toast('Export Excel lancé','','info')">↓ Exporter Excel</button>
          </div>
          <div id="import-status" class="text-mono" style="font-size: var(--fs-sm); margin-top: var(--s-3);"></div>
        </div>

        <div data-script="simulateScan"></div>
    `;

    const renderExport = () => `
      <div class="grid grid-2" style="gap: var(--s-5);">
        <div class="card">
          <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-4);">Exports standards</h3>
          <p class="text-muted" style="font-size: var(--fs-sm); margin-bottom: var(--s-4);">Téléchargez vos données dans le format de votre choix.</p>
          <div class="flex flex-col gap-2">
            ${['Liste des membres (CSV)', 'Présences (Excel)', "Rapport d'activité (PDF)", 'Agenda (ICS)', 'API JSON'].map((ex, i) => `
              <button class="btn btn-secondary" style="justify-content: space-between;" onclick="handleExport('${ex}')">
                <span class="flex items-center gap-2">${CLUBHUB.ICONS.download.replace('<svg ', '<svg width="16" height="16" ')} ${ex}</span>
                <span class="badge">${members.length}</span>
              </button>
            `).join('')}
          </div>
        </div>

        <div class="card">
          <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-4);">RGPD & conformité</h3>
          <div class="switch-row">
            <div class="switch-row-label">
              <div class="switch-row-title">Anonymisation automatique</div>
              <div class="switch-row-desc">Après 3 ans d'inactivité</div>
            </div>
            <label class="switch">
              <input type="checkbox" checked />
              <span class="switch-slider"></span>
            </label>
          </div>
          <div class="switch-row">
            <div class="switch-row-label">
              <div class="switch-row-title">Droit à l'oubli</div>
              <div class="switch-row-desc">Suppression sur demande</div>
            </div>
            <label class="switch">
              <input type="checkbox" checked />
              <span class="switch-slider"></span>
            </label>
          </div>
        </div>
      </div>
    `;

    const content = {
      overview: renderOverview(),
      members: renderMembers(),
      events: renderEvents(),
      attendance: renderAttendance(),
      comms: renderComms(),
      stats: renderStats(),
      export: renderExport(),
    }[tab] || renderOverview();

    function openEditClubModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay open';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title">Modifier le club</h3>
            <button class="btn-icon" data-close>${ClubHub.icon('x', 16)}</button>
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Description courte</label>
            <input class="input" id="ec-short-desc" value="${myClub.short_desc || ''}" />
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Description longue</label>
            <textarea class="input" id="ec-long-desc" style="min-height:80px;">${myClub.longDescription || myClub.long_desc || ''}</textarea>
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Lieu</label>
            <input class="input" id="ec-location" value="${myClub.location || myClub.room || ''}" />
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Réunion</label>
            <input class="input" id="ec-meeting" value="${myClub.meeting || ''}" />
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Capacité</label>
            <input type="number" class="input" id="ec-capacity" value="${myClub.capacity || 50}" />
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Photo du club</label>
            <input type="file" id="ec-logo" accept="image/*" />
          </div>
          <div id="ec-err" class="text-orange" style="font-size: var(--fs-sm); margin-bottom: var(--s-3); display:none;"></div>
          <div style="display: flex; gap: var(--s-3); justify-content: flex-end;">
            <button class="btn btn-secondary" data-close>Annuler</button>
            <button class="btn btn-orange" id="ec-submit">Sauvegarder</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.addEventListener('click', e => {
        if (e.target === overlay || e.target.hasAttribute('data-close')) close();
      });
      overlay.querySelector('#ec-submit').addEventListener('click', async () => {
        const errBox = overlay.querySelector('#ec-err');
        errBox.style.display = 'none';
        const updates = {
          short_desc: overlay.querySelector('#ec-short-desc').value.trim(),
          long_desc: overlay.querySelector('#ec-long-desc').value.trim(),
          room: overlay.querySelector('#ec-location').value.trim(),
          meeting: overlay.querySelector('#ec-meeting').value.trim(),
          capacity: parseInt(overlay.querySelector('#ec-capacity').value) || 50,
        };
        const logoFile = overlay.querySelector('#ec-logo').files?.[0];
        try {
          if (logoFile) {
            await ClubHubAPI.upload('club', myClub.id || myClub.slug, logoFile);
          }
          await ClubHubAPI.updateClub(myClub.id || myClub.slug, updates);
          ClubHub.toast('Club mis à jour', '', 'success');
          close();
          setTimeout(() => location.reload(), 700);
        } catch (e) {
          errBox.textContent = e.message;
          errBox.style.display = 'block';
        }
      });
    }

    function openCreateEventModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay open';
      const today = new Date().toISOString().split('T')[0];
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title">Nouvel événement</h3>
            <button class="btn-icon" data-close>${ClubHub.icon('x', 16)}</button>
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Titre</label>
            <input class="input" id="evt-title" placeholder="Ex: Atelier Python" />
          </div>
          <div class="grid grid-2" style="gap: var(--s-3); margin-bottom: var(--s-3);">
            <div class="field">
              <label class="label">Type</label>
              <select class="select" id="evt-type">
                <option>Atelier</option>
                <option>Conference</option>
                <option>Debat</option>
                <option>Spectacle</option>
                <option>Action</option>
                <option>Competition</option>
                <option>Tournoi</option>
                <option>Networking</option>
                <option>Culturel</option>
                <option>Entrainement</option>
              </select>
            </div>
            <div class="field">
              <label class="label">Catégorie</label>
              <select class="select" id="evt-category">
                <option value="CI">Club Info</option>
                <option value="CE">Club Event</option>
                <option value="CT">Club Culture</option>
                <option value="CM">Club Musique</option>
                <option value="FB">Foot / Basket</option>
                <option value="LC">Langues & Cultures</option>
              </select>
            </div>
          </div>
          <div class="grid grid-2" style="gap: var(--s-3); margin-bottom: var(--s-3);">
            <div class="field">
              <label class="label">Date</label>
              <input class="input" id="evt-date" type="date" value="${today}" />
            </div>
            <div class="field">
              <label class="label">Heure</label>
              <input class="input" id="evt-time" type="time" value="18:00" />
            </div>
          </div>
          <div class="grid grid-2" style="gap: var(--s-3); margin-bottom: var(--s-3);">
            <div class="field">
              <label class="label">Durée (min)</label>
              <input class="input" id="evt-duration" type="number" value="120" />
            </div>
            <div class="field">
              <label class="label">Lieu</label>
              <input class="input" id="evt-room" placeholder="Salle / FabLab" />
            </div>
          </div>
          <div class="field" style="margin-bottom: var(--s-4);">
            <label class="label">Description</label>
            <textarea class="input" id="evt-desc" placeholder="Description de l'événement..."></textarea>
          </div>
          <div id="evt-err" class="text-orange" style="font-size: var(--fs-sm); margin-bottom: var(--s-3); display:none;"></div>
          <div style="display: flex; gap: var(--s-3); justify-content: flex-end;">
            <button class="btn btn-secondary" data-close>Annuler</button>
            <button class="btn btn-orange" id="evt-submit">Créer l'événement</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.addEventListener('click', e => {
        if (e.target === overlay || e.target.hasAttribute('data-close')) close();
      });
      overlay.querySelector('#evt-submit').addEventListener('click', async () => {
        const errBox = overlay.querySelector('#evt-err');
        errBox.style.display = 'none';
        const title = overlay.querySelector('#evt-title').value.trim();
        const type = overlay.querySelector('#evt-type').value;
        const category = overlay.querySelector('#evt-category').value;
        const date = overlay.querySelector('#evt-date').value;
        const time = overlay.querySelector('#evt-time').value;
        const duration = parseInt(overlay.querySelector('#evt-duration').value) || 120;
        const room = overlay.querySelector('#evt-room').value.trim();
        const description = overlay.querySelector('#evt-desc').value.trim();
        if (!title || !date || !time) {
          errBox.textContent = 'Titre, date et heure sont requis.';
          errBox.style.display = 'block';
          return;
        }
        try {
          const res = await ClubHubAPI.createEvent({
            club_id: myClub.id || myClub.slug,
            title, type, category, date, time,
            duration_min: duration,
            room: room || null,
            description: description || null,
          });
          if (res.ok) {
            ClubHub.toast('Événement créé', '', 'success');
            close();
            const fresh = await ClubHubAPI.events({ club_id: myClub.id || myClub.slug });
            agendaEvents = fresh.data || [];
            render();
          } else {
            throw new Error(res.error || 'Erreur lors de la création');
          }
        } catch (e) {
          errBox.textContent = e.message;
          errBox.style.display = 'block';
        }
      });
    }

    function renderEvents() {
      const clubEvents = (agendaEvents && agendaEvents.length) ? agendaEvents : CLUBHUB.EVENTS.filter(e => e.clubId === myClub.id || e.clubId === myClub.slug);
      return `
        <div class="card">
          <div class="flex items-center justify-between" style="flex-wrap: wrap; gap: var(--s-3); margin-bottom: var(--s-4);">
            <strong style="font-size: var(--fs-lg);">Événements du club</strong>
            <button class="btn btn-orange btn-sm" onclick="openCreateEventModal()">+ Nouvel événement</button>
          </div>
          ${clubEvents.length ? `
            <div class="flex flex-col gap-3">
              ${clubEvents.map(e => `
                <div class="flex items-center gap-3" style="padding: var(--s-3); background: var(--bg-elev-1); border: 1px solid var(--border-subtle); border-radius: var(--r-sm);">
                  <div style="font-weight:700;">${e.title}</div>
                  <span class="text-muted" style="margin-left:auto; font-size:var(--fs-xs);">${e.date} · ${e.time}</span>
                  <span class="badge badge-orange">${e.type}</span>
                  <span class="text-mono" style="font-size:var(--fs-xs);">${e.registered || 0}/${e.capacity || '?'} inscrits</span>
                </div>
              `).join('')}
            </div>
          ` : '<p class="text-muted">Aucun événement pour le moment.</p>'}
        </div>
      `;
    }

    function renderComms() {
      return `
        <div class="card" style="margin-bottom: var(--s-4);">
          <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-4);">Envoyer un message</h3>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Destinataires</label>
            <select class="select" style="width:100%;">
              <option>Tous les membres</option>
              <option>Bureau uniquement</option>
              <option>Membres actifs</option>
            </select>
          </div>
          <div class="field" style="margin-bottom: var(--s-3);">
            <label class="label">Sujet</label>
            <input class="input" id="comm-subject" placeholder="Objet du message" />
          </div>
          <div class="field" style="margin-bottom: var(--s-4);">
            <label class="label">Message</label>
            <textarea class="input" id="comm-body" style="min-height:120px;" placeholder="Votre message..."></textarea>
          </div>
          <button class="btn btn-orange" onclick="sendComm()">Envoyer</button>
        </div>
        <div class="card">
          <h3 style="font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--s-4);">Historique</h3>
          <div class="flex flex-col gap-3">
            <div class="activity-item">
              <div class="activity-dot" style="background: var(--lime);"></div>
              <div class="activity-text">
                Message envoyé à tous les membres
                <div class="activity-time">Hier · 14:30</div>
              </div>
            </div>
            <div class="activity-item">
              <div class="activity-dot" style="background: var(--orange);"></div>
              <div class="activity-text">
                Rappel : Inscriptions ouvertes
                <div class="activity-time">25/07 · 09:00</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function sendComm() {
      const subject = document.getElementById('comm-subject')?.value || '';
      const body = document.getElementById('comm-body')?.value || '';
      if (!subject || !body) {
        ClubHub.toast('Veuillez remplir tous les champs', '', 'warning');
        return;
      }
      ClubHub.toast('Message envoyé', subject, 'success');
      document.getElementById('comm-subject').value = '';
      document.getElementById('comm-body').value = '';
    }

    function renderStats() {
      return `
        <div class="stats-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: var(--s-5);">
          <div class="stat-card stat-card-orange">
            <div><div class="stat-label">Membres actifs</div></div>
            <div class="stat-value">${activeMembers}</div>
          </div>
          <div class="stat-card stat-card-lime">
            <div><div class="stat-label">Événements</div></div>
            <div class="stat-value">${apiEvents.length || CLUBHUB.EVENTS.filter(e => e.clubId === myClub.id || e.clubId === myClub.slug).length}</div>
          </div>
          <div class="stat-card stat-card-white">
            <div><div class="stat-label">Présence moyenne</div></div>
            <div class="stat-value">76<span style="font-size: var(--fs-md); color: var(--text-tertiary);">%</span></div>
          </div>
          <div class="stat-card stat-card-white">
            <div><div class="stat-label">Taux d'engagement</div></div>
            <div class="stat-value">82<span style="font-size: var(--fs-md); color: var(--text-tertiary);">%</span></div>
          </div>
        </div>
        <div class="card" style="margin-bottom: var(--s-5);">
          <h3 style="font-size: var(--fs-base); font-weight: 800; margin-bottom: var(--s-4);">Inscriptions sur 6 mois</h3>
          <div class="chart-bars">
            ${[45, 60, 50, 75, 85, 95].map((h, i) => `
              <div class="chart-bar-wrap">
                <div class="chart-bar ${i % 2 === 0 ? 'orange' : ''}" style="height: ${h}%;"></div>
                <div class="chart-bar-label">${['Fév','Mars','Avr','Mai','Juin','Juil'][i]}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="card">
          <h3 style="font-size: var(--fs-base); font-weight: 800; margin-bottom: var(--s-4);">Répartition par filière</h3>
          <div class="flex flex-col gap-3" style="margin-top: var(--s-4);">
            ${[
              { label: 'Informatique', val: 92, color: 'var(--orange)' },
              { label: 'STAPS', val: 88, color: 'var(--lime)' },
              { label: 'Droit', val: 76, color: 'var(--mauve)' },
              { label: 'Lettres', val: 71, color: 'var(--blue)' },
              { label: 'Biologie', val: 68, color: 'var(--orange)' },
            ].map(f => `
              <div>
                <div class="flex justify-between" style="margin-bottom: 4px;">
                  <span style="font-size: var(--fs-sm); font-weight: 600;">${f.label}</span>
                  <span class="text-mono" style="font-size: var(--fs-sm); font-weight: 700;">${f.val}%</span>
                </div>
                <div class="progress"><div class="progress-bar" style="width: ${f.val}%; background: ${f.color};"></div></div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

ClubHub.renderShell({
      active: tab,
      role: 'manager',
      content,
      pageTitle: pageTitleMap[tab] || 'Espace responsable',
    });

    function togglePresence(card) {
      const cb = card.querySelector('.checkbox');
      cb.classList.toggle('checked');
    }

    function simulateScan() {
      const list = document.querySelectorAll('.attendance-card');
      for (const card of list) {
        const cb = card.querySelector('.checkbox');
        if (!cb.classList.contains('checked')) {
          cb.classList.add('checked');
          if (window.ClubHub && ClubHub.toast) {
            const name = card.querySelector('div[style*="font-weight: 600"]')?.textContent || 'membre';
            ClubHub.toast('Scan valide', 'Presence enregistree pour ' + name, 'success');
          }
          break;
        }
      }
    }

    async function handleCSVImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const status = document.getElementById('import-status');
      if (status) status.textContent = 'Import en cours...';
      try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('type', 'users');
        const res = await ClubHubAPI.importCSV('users', file);
        if (res.ok) {
          if (status) status.textContent = `Import reussi: ${res.data?.imported || 0} utilisateurs importes`;
          ClubHub.toast('Import reussi', `${res.data?.imported || 0} utilisateurs importes`, 'success');
        } else {
          throw new Error(res.error || 'Erreur d\'import');
        }
      } catch (e) {
        if (status) status.textContent = 'Erreur: ' + e.message;
        ClubHub.toast('Erreur', e.message, 'error');
      }
    }

    function filterMembers() {
      const search = document.getElementById('member-search');
      const roleSel = document.getElementById('member-role');
      if (!search || !roleSel) return;
      const q = search.value.toLowerCase();
      const role = roleSel.value;
      document.querySelectorAll('#members-tbody tr').forEach(row => {
        const name = row.dataset.name || '';
        const rowRole = row.dataset.role || '';
        const matchSearch = !q || name.includes(q);
        const matchRole = role === 'all' || rowRole === role;
        row.style.display = (matchSearch && matchRole) ? '' : 'none';
      });
    }

    function exportMembersCSV() {
      const rows = document.querySelectorAll('#members-tbody tr');
      let csv = 'Nom,Matricule,Filiere,Niveau,Role,Statut,Presentation\n';
      rows.forEach(row => {
        const name = row.querySelector('.member-info strong')?.textContent || '';
        const matricule = row.querySelector('.member-info span')?.textContent || '';
        const filiere = row.children[2]?.textContent || '';
        const role = row.querySelector('.badge')?.textContent || '';
        const status = row.querySelector('.badge-lime') ? 'Actif' : 'Inactif';
        const presence = row.querySelector('.progress-bar')?.style.width || '0%';
        csv += `"${name}","${matricule}","${filiere}","${role}","${status}","${presence}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'membres-' + (myClub.name || 'club') + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      ClubHub.toast('CSV exporte', '', 'success');
    }

    function handleExport(type) {
      if (type.includes('CSV')) {
        exportMembersCSV();
      } else if (type.includes('Excel')) {
        ClubHub.toast('Export Excel lance', '', 'success');
      } else if (type.includes('PDF')) {
        ClubHub.toast('Rapport PDF genere', '', 'success');
      } else if (type.includes('ICS')) {
        ClubHub.toast('Agenda ICS exporte', '', 'success');
      } else if (type.includes('JSON')) {
        ClubHub.toast('JSON exporte', '', 'success');
      }
    }

  })();
</script>
</body>
</html>

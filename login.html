<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/logo-orbit.svg" />
  <title>Connexion - Orbit</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    body {
      background: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--s-6);
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: -1;
    }
    .auth-card {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: var(--r-md);
      padding: var(--s-10);
      max-width: 440px;
      width: 100%;
      box-shadow: 8px 8px 0 var(--black);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: var(--s-2);
      margin-bottom: var(--s-8);
    }
    .auth-title {
      font-size: var(--fs-3xl);
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: var(--s-2);
    }
    .auth-subtitle {
      color: var(--text-secondary);
      font-size: var(--fs-sm);
      margin-bottom: var(--s-6);
    }
    .auth-form { display: flex; flex-direction: column; gap: var(--s-4); }
    .sso-button {
      width: 100%;
      padding: 14px 16px;
      background: var(--black);
      color: var(--white);
      border: 1px solid var(--black);
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s-2);
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t-base);
    }
    .sso-button:hover { background: var(--orange); }
    .divider-text {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      color: var(--text-tertiary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }
    .divider-text::before, .divider-text::after { content: ''; flex: 1; height: 1px; background: var(--black); }
    .role-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
    .role-option {
      padding: 10px 8px;
      border: 1px solid var(--black);
      border-radius: var(--r-sm);
      background: var(--white);
      text-align: center;
      cursor: pointer;
      transition: all var(--t-fast);
    }
    .role-option:hover { background: var(--bg-elev-1); }
    .role-option.active { background: var(--black); color: var(--white); }
    .role-option-icon { font-size: 20px; margin-bottom: 2px; }
    .role-option-label { font-size: 11px; font-weight: 600; }
    .demo-card {
      margin-top: var(--s-5);
      padding: var(--s-4);
      background: var(--lime);
      border: 1px solid var(--black);
      border-radius: var(--r-sm);
    }
    .demo-buttons { display: flex; gap: var(--s-2); margin-top: var(--s-3); }
  </style>
</head>
<body>
  <div class="page-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">CHARGEMENT</div>
  </div>

  <div class="auth-card scale-in">
    <a href="index.html" class="auth-brand">
      <svg viewBox="0 0 32 32" width="36" height="36" fill="none">
        <rect width="32" height="32" rx="6" fill="#FF4502"/>
        <circle cx="16" cy="16" r="4" fill="#FFFFFF"/>
        <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#FFFFFF" stroke-width="2" transform="rotate(-30 16 16)"/>
      </svg>
      <span class="brand-name" style="font-size: 22px;">Orbit<span style="color: var(--orange);">.</span></span>
    </a>

    <h1 class="auth-title">Bon retour parmi nous</h1>
    <p class="auth-subtitle">Connectez-vous à votre espace personnel</p>

    <button class="sso-button" onclick="quickLogin('student')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      Connexion via ENT universitaire (SSO)
    </button>

    <div class="divider-text" style="margin: var(--s-4) 0;"><span>OU</span></div>

    <form class="auth-form" onsubmit="event.preventDefault(); handleLogin();">
      <div>
        <label class="label" for="matricule">Numéro matricule</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input class="input" type="text" id="matricule" placeholder="2023A0025" />
        </div>
      </div>

      <div>
        <label class="label" for="password">Mot de passe</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input class="input" type="password" id="password" placeholder="••••••••" />
        </div>
      </div>

      <div>
        <label class="label">Type de profil</label>
        <div class="role-selector">
          <div class="role-option active" data-role="student" onclick="selectRole(this, 'student')">
            <div class="role-option-icon">◈</div>
            <div class="role-option-label">Étudiant</div>
          </div>
          <div class="role-option" data-role="manager" onclick="selectRole(this, 'manager')">
            <div class="role-option-icon">◆</div>
            <div class="role-option-label">Responsable</div>
          </div>
          <div class="role-option" data-role="admin" onclick="selectRole(this, 'admin')">
            <div class="role-option-icon">◉</div>
            <div class="role-option-label">Admin</div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="checkbox-row flex items-center gap-2" style="cursor: pointer; font-size: var(--fs-sm);" onclick="toggleCheckbox(this)">
          <div class="checkbox"></div>
          <span style="color: var(--text-secondary);">Se souvenir de moi</span>
        </label>
        <a href="#" class="link" style="font-size: var(--fs-sm); color: var(--orange-primary); font-weight: 600;">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn btn-orange btn-lg btn-full" style="margin-top: var(--s-2);">
        Se connecter
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="demo-card">
      <div class="flex items-center gap-2">
        <div style="width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--black); color: var(--lime); display: flex; align-items: center; justify-content: center; font-weight: 800;">!</div>
        <div><strong style="font-size: var(--fs-sm);">Comptes de démonstration</strong></div>
      </div>
      <p style="font-size: var(--fs-xs); color: var(--text-primary); margin-top: var(--s-2); margin-bottom: var(--s-3); font-weight: 500;">Cliquez pour vous connecter instantanément.</p>
      <div class="demo-buttons">
        <button class="btn btn-sm" style="flex:1; background: var(--white);" onclick="quickLogin('student')">Étudiant</button>
        <button class="btn btn-sm" style="flex:1; background: var(--white);" onclick="quickLogin('manager')">Responsable</button>
        <button class="btn btn-sm" style="flex:1; background: var(--white);" onclick="quickLogin('admin')">Admin</button>
      </div>
    </div>

    <p style="text-align: center; margin-top: var(--s-6); font-size: var(--fs-sm); color: var(--text-secondary);">
      Pas encore de compte ? <a href="register.html" style="color: var(--orange); font-weight: 700;">Créer un compte</a>
    </p>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('load', () => ClubHub.hideLoader());
    let selectedRole = 'student';
    function selectRole(el, role) {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      selectedRole = role;
    }
    function toggleCheckbox(row) { row.querySelector('.checkbox').classList.toggle('checked'); }
    function quickLogin(role) {
      const u = ClubHub.Auth.login(role);
      if (u) { ClubHub.toast('Connexion réussie', 'Bienvenue ' + u.name, 'success'); setTimeout(() => window.location.href = u.redirect, 600); }
    }
    async function handleLogin() {
      const m = document.getElementById('matricule').value.trim().toUpperCase();
      const p = document.getElementById('password').value;
      if (!m || !p) { ClubHub.toast('Champs requis', '', 'error'); return; }
      try {
        const r = await ClubHubAPI.login(m, p);
        if (r.token) localStorage.setItem('clubhub_token', r.token);
        if (r.data) {
          localStorage.setItem('clubhub_current_user', JSON.stringify(r.data));
          ClubHub.toast('Connexion réussie', 'Bienvenue ' + r.data.name, 'success');
          setTimeout(() => window.location.href = (r.data.role === 'admin' ? 'admin.html' : r.data.role === 'manager' ? 'manager.html' : 'dashboard.html'), 600);
        }
      } catch (e) {
        ClubHub.toast('Erreur', e.message, 'error');
      }
    }
    document.getElementById('matricule').value = '2023A0025';
    document.getElementById('password').value = 'demo1234';
  </script>
</body>
</html>

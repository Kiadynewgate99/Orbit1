<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/logo-orbit.svg" />
  <title>Tableau de bord - Orbit</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .welcome-card {
      background: var(--black);
      color: var(--white);
      border: 2px solid var(--black);
      border-radius: var(--r-md);
      padding: var(--s-6);
      margin-bottom: var(--s-5);
      box-shadow: 4px 4px 0 var(--orange);
    }
    .suggestion-card {
      background: var(--lime);
      border: 2px solid var(--black);
      border-radius: var(--r-md);
      padding: var(--s-5);
    }
  </style>
</head>
<body>
  <div class="page-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">CHARGEMENT</div>
  </div>

  <div class="app-shell-mount"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('load', () => ClubHub.hideLoader());

    const user = ClubHub.Auth.require();
    if (!user) throw new Error('Unauthorized');

    const params = new URLSearchParams(window.location.search);
    const tab = params.get('tab') || 'overview';

    let allClubs = [];
    let allEvents = [];
    let apiStats = null;

    async function init() {
      try {
        const [clubsRes, eventsRes, statsRes] = await Promise.all([
          ClubHubAPI.myClubs(),
          ClubHubAPI.events(),
          ClubHubAPI.stats(),
        ]);
        allClubs = clubsRes.data || [];
        allEvents = eventsRes.data || [];
        apiStats = statsRes.data || {};
      } catch (e) {
        allClubs = CLUBHUB.CLUBS.filter(c => user.clubs?.includes(c.id));
        allEvents = CLUBHUB.EVENTS.filter(e => user.events?.includes(e.id));
      }
      render();
    }

    const myClubs = () => allClubs;
    const myEvents = () => allEvents.filter(e => new Date(e.date) > new Date());
    const upcomingEvents = () => allEvents.filter(e => new Date(e.date) > new Date()).slice(0, 4);

    const stats = {
      clubs: myClubs().length || 0,
      events: myEvents().length || 0,
      attendance: apiStats?.users_total ? Math.min(100, Math.round((myClubs().length || 0) * 12 + 50)) : 100,
      points: apiStats?.users_total ? (myClubs().length || 0) * 50 + (myEvents().length || 0) * 10 + Math.round((apiStats.users_total || 0) / 10) : (myClubs().length || 0) * 50 + (myEvents().length || 0) * 10,
    };

    const pageTitleMap = {
      overview: 'Bonjour, ' + user.name.split(' ')[0],
      clubs: 'Mes clubs',
      events: 'Mes événements',
    };

    const renderOverview = () => `
      <div class="welcome-card">
        <div class="flex items-center gap-4" style="flex-wrap: wrap;">
          <div class="avatar avatar-xl avatar-orange" style="width: 72px; height: 72px; font-size: 24px;">${user.avatar}</div>
          <div style="flex: 1; min-width: 200px;">
            <div class="text-mono" style="font-size: 11px; color: var(--lime); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;">DASHBOARD / ÉTUDIANT</div>
            <div style="font-size: var(--fs-2xl); font-weight: 900; margin-top: 4px;">Bienvenue, ${user.name.split(' ')[0]}</div>
            <div style="color: rgba(255,255,255,0.7); font-size: var(--fs-sm);">Voici un aperçu de votre activité sur la plateforme.</div>
          </div>
          <a href="events.html" class="btn btn-orange">Explorer les événements</a>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card stat-card-orange">
          <div>
            <div class="stat-label">Clubs actifs</div>
            <span class="stat-trend">+ ${stats.clubs} ce mois</span>
          </div>
          <div class="stat-value">${stats.clubs}</div>
        </div>
        <div class="stat-card stat-card-lime">
          <div>
            <div class="stat-label">Événements à venir</div>
            <span class="stat-trend" style="background: rgba(0,0,0,0.1);">+ ${stats.events} inscrits</span>
          </div>
          <div class="stat-value">${stats.events}</div>
        </div>
        <div class="stat-card stat-card-white">
          <div>
            <div class="stat-label">Taux de présence</div>
            <span class="stat-trend" style="background: var(--lime); color: var(--black);">+ 12% ce mois</span>
          </div>
          <div class="stat-value">${stats.attendance}<span style="font-size: var(--fs-md); color: var(--text-tertiary);">%</span></div>
        </div>
      </div>

      <div class="grid" style="grid-template-columns: 2fr 1fr; gap: var(--s-5);">
        <div>
          <div class="card" style="margin-bottom: var(--s-4);">
            <div class="flex items-center justify-between" style="margin-bottom: var(--s-4);">
              <h2 style="font-size: var(--fs-lg); font-weight: 800;">Prochains événements</h2>
              <a href="events.html" class="btn btn-ghost btn-sm">Voir tout →</a>
            </div>
            ${upcomingEvents().length === 0 ? `
              <div class="empty">
                <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/></svg></div>
                <div class="empty-title">Aucun événement à venir</div>
                <div class="empty-text">Inscrivez-vous à un club pour découvrir les activités.</div>
                <a href="clubs.html" class="btn btn-orange btn-sm">Explorer les clubs</a>
              </div>
            ` : upcomingEvents().map(evt => {
              const d = ClubHub.formatDate(evt.date, { short: true });
              const club = allClubs.find(c => c.id === evt.club_id || c.slug === evt.club_id) || CLUBHUB.CLUBS.find(c => c.id === evt.clubId || c.slug === evt.clubId);
              return `
                <div class="event-row" style="margin-bottom: var(--s-3);">
                  <div style="flex: 1;">
                    <div class="event-row-header" style="background: ${club.color}; color: var(--black);">
                      <span>${d.day} ${d.month.toUpperCase()}</span>
                      <span>${evt.time} · ${club?.icon || ''}</span>
                    </div>
                     <div class="event-row-content">
                       <div class="event-title">${evt.title}</div>
                       <div class="event-meta">
                         <span class="event-meta-item">◷ ${evt.duration_min || evt.duration}min</span>
                         <span class="event-meta-item">◎ ${evt.room || evt.location || ''}</span>
                         <span class="event-meta-item">${club?.name || club?.slug || ''}</span>
                       </div>
                     </div>
                  </div>
                  <div style="padding: var(--s-4); display: flex; align-items: center;">
                    <span class="badge badge-orange">${evt.type}</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div>
          <div class="card" style="margin-bottom: var(--s-4);">
            <h3 style="font-size: var(--fs-base); font-weight: 800; margin-bottom: var(--s-4);">Activité récente</h3>
            <div class="activity-item">
              <div class="activity-dot"></div>
              <div class="activity-text">
                Inscription au <strong>Club Robotique</strong> confirmée
                <div class="activity-time">Il y a 2 heures</div>
              </div>
            </div>
            <div class="activity-item">
              <div class="activity-dot" style="background: var(--mauve);"></div>
              <div class="activity-text">
                Présence validée à <strong>Atelier Python</strong>
                <div class="activity-time">Hier</div>
              </div>
            </div>
            <div class="activity-item">
              <div class="activity-dot" style="background: var(--blue);"></div>
              <div class="activity-text">
                Rappel pour <strong>Débat IA & éthique</strong>
                <div class="activity-time">Il y a 3 heures</div>
              </div>
            </div>
            <div class="activity-item">
              <div class="activity-dot" style="background: var(--lime);"></div>
              <div class="activity-text">
                +50 points d'engagement gagnés
                <div class="activity-time">Cette semaine</div>
              </div>
            </div>
          </div>

          <div class="suggestion-card">
            <div class="flex items-center gap-3" style="margin-bottom: var(--s-3);">
              <div style="width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--black); color: var(--lime); display: flex; align-items: center; justify-content: center;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              </div>
              <div>
                <strong style="font-size: var(--fs-sm); display: block;">Suggestion personnalisée</strong>
                <span style="font-size: 11px; font-weight: 600;">Basé sur vos centres d'intérêt</span>
              </div>
            </div>
            <p style="font-size: var(--fs-sm); color: var(--text-primary); line-height: 1.5; margin-bottom: var(--s-3); font-weight: 500;">
              Le <strong>Club Langues & Cultures</strong> propose un atelier de japonais qui pourrait vous intéresser.
            </p>
            <a href="club.html?id=club-012" class="btn btn-dark btn-sm btn-full">Découvrir le club</a>
          </div>

          <div class="card" style="margin-top: var(--s-4); background: var(--black); color: var(--white);">
            <div class="flex items-center justify-between" style="margin-bottom: var(--s-3);">
              <div>
                <div class="text-mono" style="font-size: 10px; color: var(--lime); letter-spacing: 0.15em; font-weight: 700;">GAMIFICATION</div>
                <strong style="font-size: var(--fs-md); color: var(--white);">Mon classement</strong>
              </div>
              <a href="leaderboard.html" style="color: var(--lime); font-size: 11px; font-weight: 700;">Voir tout →</a>
            </div>
            <div class="flex items-center gap-3" style="margin-bottom: var(--s-3);">
              <div style="font-family: var(--font-mono); font-size: 36px; font-weight: 900; color: var(--lime);">#42</div>
              <div style="flex: 1;">
                <div style="font-size: 12px; color: rgba(255,255,255,0.7);">sur 847 etudiants</div>
                <div style="font-family: var(--font-mono); font-size: 18px; font-weight: 800; color: var(--white);">120 points</div>
              </div>
            </div>
            <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">
              <div style="height: 100%; width: 60%; background: var(--lime); border-radius: 3px;"></div>
            </div>
            <div class="text-mono" style="font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 4px;">Plus que 28 pts pour depasser #41</div>
          </div>
        </div>
      </div>

      <h2 style="font-size: var(--fs-xl); font-weight: 800; margin: var(--s-8) 0 var(--s-4);">Mes clubs</h2>
      <div class="grid grid-3">
        ${myClubs().length === 0 ? `
          <div class="empty" style="grid-column: 1 / -1;">
            <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg></div>
            <div class="empty-title">Vous n'êtes inscrit à aucun club</div>
            <div class="empty-text">Découvrez les clubs et rejoignez ceux qui vous correspondent.</div>
            <a href="clubs.html" class="btn btn-orange btn-sm">Explorer l'annuaire</a>
          </div>
        ` : myClubs().map(club => {
          const domainLabel = CLUBHUB.CLUB_CATEGORIES.find(c => c.id === club.category || c.id === club.domain)?.label || club.category || club.domain || '';
          const clubEvents = allEvents.filter(e => (e.club_id === club.id || e.clubId === club.id) && new Date(e.date) > new Date()).length;
          return `
          <a href="club.html?id=${club.slug || club.id}" class="club-card">
            <div class="club-card-header">
              <span>${club.slug || club.id}</span>
              <span>◉</span>
            </div>
            <div class="club-card-body">
              <div class="club-card-icon" style="background: ${club.color};">${club.name.substring(0, 2).toUpperCase()}</div>
              <div class="club-card-name">${club.name}</div>
              <div class="club-card-domain">${domainLabel}</div>
              <div class="club-card-desc">${club.short_desc || club.description || ''}</div>
              <div class="club-card-footer">
                <span>◉ Membre</span>
                <span>◷ ${clubEvents} événements</span>
              </div>
            </div>
          </a>
        `;
      }).join('')}
      </div>
    `;

    const renderClubs = () => `
      <div class="grid grid-3">
        ${myClubs().length === 0 ? `
          <div class="empty" style="grid-column: 1 / -1;">
            <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg></div>
            <div class="empty-title">Vous n'êtes inscrit à aucun club</div>
            <div class="empty-text">Découvrez les clubs disponibles et rejoignez la communauté.</div>
            <a href="clubs.html" class="btn btn-orange btn-sm">Voir l'annuaire</a>
          </div>
        ` : myClubs().map(club => {
          const domainLabel = CLUBHUB.CLUB_CATEGORIES.find(c => c.id === club.category || c.id === club.domain)?.label || club.category || club.domain || '';
          return `
          <div class="card">
            <div class="flex items-center gap-3" style="margin-bottom: var(--s-3);">
              <div class="avatar avatar-lg" style="background: ${club.color}; color: var(--white);">${club.name.substring(0, 2).toUpperCase()}</div>
              <div style="flex: 1;">
                <strong style="font-size: var(--fs-lg); display: block;">${club.name}</strong>
                <div class="text-mono" style="font-size: 10px; color: var(--orange); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;">${domainLabel}</div>
              </div>
              <span class="badge badge-lime">Membre</span>
            </div>
            <p style="font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.5; margin-bottom: var(--s-4);">${club.short_desc || club.description || ''}</p>
            <div class="flex gap-2" style="margin-bottom: var(--s-4); flex-wrap: wrap;">
              ${(club.tags || []).slice(0, 3).map(t => `<span class="badge">${t}</span>`).join('')}
            </div>
            <div class="flex gap-2">
              <a href="club.html?id=${club.slug || club.id}" class="btn btn-primary btn-sm" style="flex: 1;">Voir le club</a>
              <button class="btn btn-secondary btn-sm" onclick="leaveClub('${club.slug || club.id}')">Quitter</button>
            </div>
          </div>
        `;
      }).join('')}
      </div>
    `;

    const renderEvents = () => `
      <div class="toolbar">
        <div class="search-input toolbar-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Rechercher un événement..." />
        </div>
        <div class="chip-group">
          <button class="chip active">À venir (${myEvents().length})</button>
          <button class="chip">Passés</button>
        </div>
      </div>
      <div class="flex flex-col gap-3">
        ${myEvents().length === 0 ? `
          <div class="empty">
            <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/></svg></div>
            <div class="empty-title">Aucun événement inscrit</div>
            <div class="empty-text">Explorez l'agenda pour découvrir les prochaines activités.</div>
            <a href="events.html" class="btn btn-orange btn-sm">Voir l'agenda</a>
          </div>
        ` : myEvents().map(evt => {
          const d = ClubHub.formatDate(evt.date, { short: true });
          const club = allClubs.find(c => c.id === evt.club_id || c.slug === evt.club_id) || CLUBHUB.CLUBS.find(c => c.id === evt.clubId || c.slug === evt.clubId);
          return `
            <div class="event-row">
              <div style="flex: 1;">
                <div class="event-row-header" style="background: var(--lime);">
                  <span>${d.day} ${d.month.toUpperCase()}</span>
                  <span>${evt.time}</span>
                </div>
                <div class="event-row-content">
                  <div class="event-title">${evt.title}</div>
                  <div class="event-meta"><span>${club?.name || club?.slug || ''} · ${evt.room || evt.location || ''}</span></div>
                </div>
              </div>
              <div style="padding: var(--s-4); display: flex; align-items: center; gap: var(--s-2);">
                <span class="badge badge-lime">Présent</span>
                <button class="btn btn-ghost btn-sm">Détails</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    const content = tab === 'clubs' ? renderClubs() : tab === 'events' ? renderEvents() : renderOverview();

    ClubHub.renderShell({
      active: tab,
      role: 'student',
      content,
      pageTitle: pageTitleMap[tab] || 'Tableau de bord',
    });

    init();

    async function leaveClub(clubId) {
      ClubHub.confirm('Quitter le club', 'Êtes-vous sûr de vouloir quitter ce club ?', async () => {
        try {
          await ClubHubAPI.leaveClub(clubId);
          ClubHub.toast('Désinscription confirmée', '', 'info');
          setTimeout(() => location.reload(), 800);
        } catch (e) {
          ClubHub.toast('Erreur', e.message, 'error');
        }
      });
    }
  </script>
</body>
</html>
